<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="scanBg" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#0B3B60" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#0B3B60" stop-opacity="0"/>
    </radialGradient>

    <!-- Laser Line Gradient -->
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0"/>
      <stop offset="25%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#38BDF8" stop-opacity="1"/>
      <stop offset="75%" stop-color="#38BDF8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </linearGradient>

    <!-- Scanning Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes laserMove {
        0%, 100% { transform: translateY(25px); opacity: 0.85; }
        50% { transform: translateY(185px); opacity: 1; }
      }
      @keyframes reticleRotate {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes reticleCounter {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }
      @keyframes nodePulse {
        0%, 100% { r: 3; fill-opacity: 0.8; }
        50% { r: 4.5; fill-opacity: 1; }
      }
      @keyframes gridFade {
        0%, 100% { opacity: 0.25; }
        50% { opacity: 0.55; }
      }
      .anim-laser { animation: laserMove 3.2s ease-in-out infinite; }
      .anim-rotate { transform-origin: 160px 105px; animation: reticleRotate 14s linear infinite; }
      .anim-counter { transform-origin: 160px 105px; animation: reticleCounter 20s linear infinite; }
      .anim-node { animation: nodePulse 2s ease-in-out infinite; }
      .anim-grid { animation: gridFade 4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Ambient Backdrop -->
  <rect x="0" y="0" width="320" height="220" rx="12" fill="url(#scanBg)"/>

  <!-- Perspective Coordinate Grid -->
  <g class="anim-grid" stroke="#0284C7" stroke-width="0.75" stroke-dasharray="2 3">
    <line x1="40" y1="35" x2="280" y2="35"/>
    <line x1="30" y1="70" x2="290" y2="70"/>
    <line x1="25" y1="105" x2="295" y2="105"/>
    <line x1="30" y1="140" x2="290" y2="140"/>
    <line x1="40" y1="175" x2="280" y2="175"/>
    
    <line x1="60" y1="20" x2="60" y2="190"/>
    <line x1="110" y1="20" x2="110" y2="190"/>
    <line x1="160" y1="20" x2="160" y2="190"/>
    <line x1="210" y1="20" x2="210" y2="190"/>
    <line x1="260" y1="20" x2="260" y2="190"/>
  </g>

  <!-- Biometric Face Wireframe Contour -->
  <g stroke="#0284C7" stroke-width="1.4" fill="none" opacity="0.85">
    <!-- Outer Face Contour -->
    <path d="M125 55 C125 40, 195 40, 195 55 C198 85, 190 120, 160 155 C130 120, 122 85, 125 55 Z"/>
    
    <!-- Forehead & Eyebrow Wireframe -->
    <line x1="135" y1="70" x2="152" y2="68"/>
    <line x1="168" y1="68" x2="185" y2="70"/>
    <line x1="152" y1="68" x2="168" y2="68"/>

    <!-- Left Eye Polygon -->
    <polygon points="138,78 146,74 154,78 146,82" stroke="#38BDF8" fill="#38BDF8" fill-opacity="0.15"/>
    <!-- Right Eye Polygon -->
    <polygon points="166,78 174,74 182,78 174,82" stroke="#38BDF8" fill="#38BDF8" fill-opacity="0.15"/>

    <!-- Nose Bridge & Triangulation -->
    <path d="M160 70 L156 102 L160 106 L164 102 Z" stroke="#38BDF8"/>
    <line x1="146" y1="78" x2="156" y2="102" stroke-dasharray="2 2" stroke-width="0.9"/>
    <line x1="174" y1="78" x2="164" y2="102" stroke-dasharray="2 2" stroke-width="0.9"/>

    <!-- Mouth & Chin Contour -->
    <polygon points="148,122 160,118 172,122 160,126" stroke="#38BDF8" fill="#38BDF8" fill-opacity="0.15"/>
    <line x1="156" y1="106" x2="160" y2="118" stroke-dasharray="2 2" stroke-width="0.9"/>
    <line x1="160" y1="126" x2="160" y2="148" stroke-dasharray="2 2" stroke-width="0.9"/>
  </g>

  <!-- Facial Landmark Nodes (Pulsing Biometric Anchors) -->
  <g fill="#38BDF8" filter="url(#glow)">
    <circle cx="146" cy="78" r="3.2" class="anim-node"/>
    <circle cx="174" cy="78" r="3.2" class="anim-node"/>
    <circle cx="160" cy="104" r="3" class="anim-node"/>
    <circle cx="160" cy="122" r="3" class="anim-node"/>
    <circle cx="160" cy="148" r="2.8" class="anim-node"/>
    <circle cx="125" cy="85" r="2.4" class="anim-node"/>
    <circle cx="195" cy="85" r="2.4" class="anim-node"/>
  </g>

  <!-- Rotating Circular Reticle Overlay -->
  <g class="anim-rotate" stroke="#38BDF8" stroke-width="1.2" fill="none" opacity="0.75">
    <circle cx="160" cy="105" r="70" stroke-dasharray="14 10 4 10"/>
    <circle cx="160" cy="105" r="78" stroke-dasharray="2 8" stroke-width="1.5"/>
  </g>
  <g class="anim-counter" stroke="#0284C7" stroke-width="1" fill="none" opacity="0.6">
    <circle cx="160" cy="105" r="54" stroke-dasharray="25 15"/>
  </g>

  <!-- Corner Alignment Brackets -->
  <g stroke="#0284C7" stroke-width="2.5" stroke-linecap="round" fill="none">
    <!-- Top-Left -->
    <path d="M35 50 L35 30 L55 30"/>
    <!-- Top-Right -->
    <path d="M265 30 L285 30 L285 50"/>
    <!-- Bottom-Left -->
    <path d="M35 160 L35 180 L55 180"/>
    <!-- Bottom-Right -->
    <path d="M265 180 L285 180 L285 160"/>
  </g>

  <!-- Live Animated Laser Scanning Beam -->
  <g class="anim-laser" filter="url(#glow)">
    <line x1="30" y1="0" x2="290" y2="0" stroke="url(#laserGrad)" stroke-width="2.6"/>
    <!-- Laser Center Pulse Core -->
    <circle cx="160" cy="0" r="3" fill="#FFFFFF"/>
  </g>

  <!-- HUD Status Chips -->
  <g font-family="'JetBrains Mono', monospace" font-size="9" fill="#0284C7" font-weight="600">
    <text x="38" y="24">BIOMETRIC_ENGINE: READY</text>
    <text x="210" y="24" text-anchor="end">EMB: 512-DIM</text>
    <text x="38" y="196">FACE_DETECTOR: ACTIVE</text>
    <text x="282" y="196" text-anchor="end">MODEL: VGGFACE2</text>
  </g>
</svg>
