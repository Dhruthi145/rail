<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="alertGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#DC2626" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#DC2626" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes pulseAlert {
        0% { transform: scale(0.92); opacity: 0.95; }
        50% { transform: scale(1.1); opacity: 0.35; }
        100% { transform: scale(0.92); opacity: 0.95; }
      }
      .anim-alert-ring { transform-origin: center; animation: pulseAlert 1.6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="75" fill="url(#alertGlow)"/>

  <!-- Pulsing Hazard Ring -->
  <circle cx="80" cy="80" r="62" fill="none" stroke="#DC2626" stroke-width="2" stroke-dasharray="8 6" class="anim-alert-ring"/>

  <!-- Shield Base -->
  <path d="M80 25 C98 25, 122 33, 126 45 C126 80, 102 110, 80 128 C58 110, 34 80, 34 45 C38 33, 62 25, 80 25 Z" 
        fill="#FEF2F2" stroke="#DC2626" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Exclamation Mark -->
  <line x1="80" y1="52" x2="80" y2="84" stroke="#DC2626" stroke-width="6" stroke-linecap="round"/>
  <circle cx="80" cy="99" r="3.8" fill="#DC2626"/>

  <!-- Biometric Nodes -->
  <circle cx="48" cy="46" r="3" fill="#DC2626"/>
  <circle cx="112" cy="46" r="3" fill="#DC2626"/>
  <circle cx="80" cy="120" r="3" fill="#DC2626"/>
</svg>
