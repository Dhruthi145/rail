<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="checkGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <style>
      @keyframes pulseRing {
        0% { transform: scale(0.9); opacity: 0.9; }
        50% { transform: scale(1.08); opacity: 0.4; }
        100% { transform: scale(0.9); opacity: 0.9; }
      }
      .anim-ring { transform-origin: center; animation: pulseRing 2.4s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="80" cy="80" r="75" fill="url(#checkGlow)"/>

  <!-- Pulsing Orbit Ring -->
  <circle cx="80" cy="80" r="62" fill="none" stroke="#10B981" stroke-width="1.8" stroke-dasharray="6 6" class="anim-ring"/>

  <!-- Shield Base -->
  <path d="M80 25 C98 25, 122 33, 126 45 C126 80, 102 110, 80 128 C58 110, 34 80, 34 45 C38 33, 62 25, 80 25 Z" 
        fill="#ECFDF5" stroke="#10B981" stroke-width="3.5" stroke-linejoin="round"/>

  <!-- Crisp Checkmark -->
  <path d="M58 76 L73 91 L103 59" fill="none" stroke="#10B981" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Biometric Nodes -->
  <circle cx="48" cy="46" r="3" fill="#10B981"/>
  <circle cx="112" cy="46" r="3" fill="#10B981"/>
  <circle cx="80" cy="120" r="3" fill="#10B981"/>
</svg>
