<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0B3B60" />
    </linearGradient>
    <linearGradient id="trainGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0B3B60" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Shield Boundary -->
  <path d="M50 8 C68 8, 86 16, 88 28 C88 56, 72 82, 50 94 C28 82, 12 56, 12 28 C14 16, 32 8, 50 8 Z" 
        fill="url(#shieldGrad)" filter="url(#shadow)" stroke="#38BDF8" stroke-width="2" stroke-linejoin="round"/>

  <!-- AI Radar Beam Wave -->
  <path d="M30 46 A22 22 0 0 1 70 46" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 4"/>
  <path d="M22 52 A32 32 0 0 1 78 52" fill="none" stroke="#7DD3FC" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="3 4"/>

  <!-- High-Speed Bullet Train Front Face -->
  <!-- Main Nose Cone -->
  <path d="M50 24 C41 24, 34 32, 33 46 L33 66 C33 70, 36 74, 40 76 L50 78 L60 76 C64 74, 67 70, 67 66 L67 46 C66 32, 59 24, 50 24 Z" 
        fill="url(#trainGrad)" stroke="#0B3B60" stroke-width="1.5"/>

  <!-- Windshield Cockpit Glass -->
  <path d="M50 30 C44 30, 38 34, 37 41 L63 41 C62 34, 56 30, 50 30 Z" fill="#0F2B48"/>
  <line x1="50" y1="30" x2="50" y2="41" stroke="#38BDF8" stroke-width="1.5"/>

  <!-- Dual LED Headlights -->
  <circle cx="39" cy="62" r="3.2" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
  <circle cx="61" cy="62" r="3.2" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
  <circle cx="39" cy="62" r="1.2" fill="#FFFFFF"/>
  <circle cx="61" cy="62" r="1.2" fill="#FFFFFF"/>

  <!-- Aerodynamic Center Fin Accent -->
  <line x1="50" y1="44" x2="50" y2="66" stroke="#0284C7" stroke-width="2" stroke-linecap="round"/>

  <!-- Front Cowcatcher Grill -->
  <line x1="42" y1="71" x2="58" y2="71" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="44" y1="74" x2="56" y2="74" stroke="#94A3B8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Bottom Track Rails Base -->
  <line x1="28" y1="84" x2="72" y2="84" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="33" y1="88" x2="67" y2="88" stroke="#7DD3FC" stroke-width="2" stroke-linecap="round"/>
</svg>
